[project]
name = "mylnet-proxy-rules"
version = "0.1.0"
description = "Web editor for the mihomo extend rules consumed by the mylnet Ansible repo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# The app shells out to ansible-playbook rather than importing it, so this is
# only needed where the app actually runs.
deploy = ["ansible-core>=2.18"]
dev = ["httpx>=0.28", "mypy>=1.14", "pytest>=8.3", "ruff>=0.9", "types-pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
